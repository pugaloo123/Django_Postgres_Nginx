<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Спортсмены{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; color: #333; }
        header { background: #1a73e8; color: white; padding: 16px 32px; }
        header a { color: white; text-decoration: none; font-size: 1.4rem; font-weight: bold; }
        main { max-width: 900px; margin: 32px auto; padding: 0 16px; }
        .card {
            background: white;
            border-radius: 8px;
            padding: 20px 24px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.1);
        }
        .card h2 { margin-bottom: 8px; }
        .card a { color: #1a73e8; text-decoration: none; }
        .card a:hover { text-decoration: underline; }
        .badge {
            display: inline-block;
            background: #e8f0fe;
            color: #1a73e8;
            border-radius: 12px;
            padding: 2px 12px;
            font-size: .85rem;
            margin-bottom: 10px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 8px 20px;
            background: #1a73e8;
            color: white;
            border-radius: 6px;
            text-decoration: none;
        }
        .btn:hover { background: #1557b0; }
    </style>
</head>
<body>
    <header>
        <a href="/">Список спортсменов</a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
